
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution animation
        uses: Platane/snk@v3
        with:
          github_user_name: Venu2328
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=852B32&color_dots=F4EBDD,E7C7B0,D99579,B96649,852B32

      - name: Publish animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
