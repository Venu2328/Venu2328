# Draws the red/beige contribution snake used in the "05 — GitHub signal" section.
# Output is pushed to the `output` branch, which the README reads from.
name: Contribution snake

on:
  push:
    branches: [main]          # runs right after you commit this file
  schedule:
    - cron: "17 0 * * *"      # then refreshes daily (00:17 UTC)
  workflow_dispatch:          # and on demand from the Actions tab

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#B4212A&color_dots=#EADBC6,#E3B9A3,#CF7F69,#B4212A,#7C161D
            dist/snake-dark.svg?color_snake=#F1E2CC&color_dots=#2A1D1D,#5E2227,#8F242B,#C4343A,#E8615A

      - name: Publish to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
